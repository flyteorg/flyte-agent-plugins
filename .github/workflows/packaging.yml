name: packaging

# Build all four published distributions (flyte-skills and flyte-agent-plugins,
# on npm and PyPI) and prove each one installs. Runs on any change that can
# alter the payload, so a broken package is caught in review rather than at
# release time.
on:
  pull_request:
    paths:
      - "plugins/**"
      - "packaging/**"
      - "package.json"
      - ".github/workflows/packaging.yml"
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "packaging/**"
      - "package.json"
      - ".github/workflows/packaging.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install --upgrade build
      - name: Build and verify every distribution
        run: python packaging/verify.py
