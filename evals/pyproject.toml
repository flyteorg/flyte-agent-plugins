[project]
name = "flyte-agent-plugin-evals"
version = "0.0.1"
description = "Testing & eval harness for the Flyte agent plugin."
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# Installed on the Flyte task image / CI, not needed for the pure-static path.
flyte = ["flyte>=2.5.0"]
dev = ["pytest>=8.0"]

[project.scripts]
flyte-evals = "evals.harness.run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# The package root is this directory (evals/), imported as `evals`.
where = [".."]
include = ["evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
